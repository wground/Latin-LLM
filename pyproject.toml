[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "latin-llm"
version = "0.2.0"
description = "A small looped-depth GPT trained from scratch on a Latin corpus"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Willow Groundwater-Schuldt" }]

# Pinned to the versions this project is actually developed and tested against
# (see src/latin_training_config.json, regenerated by detect_system.py).
dependencies = [
    "torch==2.7.1",
    "numpy>=2.0,<3",
    "tokenizers>=0.15,<1",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
logging = ["wandb>=0.21"]
dev = ["pytest>=8.0"]

[project.scripts]
latin-prepare = "prepare_corpus:main"
latin-train = "train_latin:main"
latin-eval = "evaluate:main"
latin-scriptor = "scriptor:main"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = [
    "paths",
    "artifacts",
    "model",
    "prepare_corpus",
    "train_latin",
    "evaluate",
    "sample_latin",
    "scriptor",
    "detect_system",
]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src"]
